<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8">

    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Feedback Submitted — StudentHub</title>

    <link rel="stylesheet" href="../css/style.css">

    <link
        rel="stylesheet"
        href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.6.0/css/all.min.css"
    >

</head>

<body>

    <main
        style="
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 2rem;
        "
    >

        <div
            style="
                max-width: 550px;
                width: 100%;
                text-align: center;
                background: var(--bg-surface);
                border: 1px solid var(--border-subtle);
                border-radius: 24px;
                padding: 3rem 2rem;
                box-shadow: var(--shadow-lg);
            "
        >

            <div
                style="
                    width: 80px;
                    height: 80px;
                    margin: 0 auto 1.5rem;
                    border-radius: 50%;
                    display: flex;
                    align-items: center;
                    justify-content: center;
                    background: #dcfce7;
                    color: #16a34a;
                    font-size: 2rem;
                "
            >

                <i class="fa-solid fa-check"></i>

            </div>

            <h1>Feedback Submitted Successfully!</h1>

            <p>
                Thank you for sharing your feedback with StudentHub.
                Your response has been recorded successfully.
            </p>

            <a
                href="dashboard.html"
                class="btn btn-primary"
                style="display: inline-block; margin-top: 1rem;"
            >
                Go to Dashboard
            </a>

        </div>

    </main>

</body>

</html>
